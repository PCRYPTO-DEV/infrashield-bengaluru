[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-maps"
version = "0.1.0"
description = "Doctor Maps: a Claude-powered agent that builds anything inside QGIS."
readme = "doctor_maps/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["anthropic>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doctor-maps = "doctor_maps.cli:main"

[tool.setuptools]
packages = ["doctor_maps", "doctor_maps.plugin"]

[tool.setuptools.package-data]
doctor_maps = ["metadata.txt", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
